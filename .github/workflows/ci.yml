name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src
      - name: Run regression tests
        run: |
          python -m pytest -q \
            tests/test_regress_theme_and_bands.py \
            tests/test_contract_event_and_history.py \
            tests/test_theme_fallback_top_movers.py \
            tests/test_theme_pool_snapshot_paths.py \
            tests/test_theme_pool_impl_nan_and_scale.py \
            tests/test_strict_no_pseudo_output.py
      - name: Contract self-check
        env:
          PYTHONPATH: src
        run: python -m gp_assistant.recommend.self_check_contract
      - name: Self-check (contract)
        env:
          PYTHONPATH: src
          GP_SELF_CHECK_MODE: contract
        run: python -m gp_assistant.recommend.self_check
  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
