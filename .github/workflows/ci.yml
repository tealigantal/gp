name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src
      - name: Run unified protocol tests
        run: python -m pytest -q
      - name: Contract self-check
        env:
          PYTHONPATH: src
        run: python -m gp_assistant.selection_engine.self_check_contract
      - name: Contract manifest
        env:
          PYTHONPATH: src
        run: python -m gp_assistant.contracts.manifest --check
      - name: Retired symbols
        env:
          PYTHONPATH: src
        run: python -m gp_assistant.contracts.check_retired
  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
