services:
  gp:
    # Mount source for fast local dev (no rebuild on code change)
    volumes:
      - ./src:/app/src
    # Prefer multiple workers to avoid blocking during long tasks
    # 若需要热重载，请临时改回 --reload（注意与 --workers 互斥）
    command: ["uvicorn","gp_assistant.server.app:app","--host","0.0.0.0","--port","8000","--workers","2"]

  # Do not start/build web by default in local dev
  web:
    # Always included now; keep here for future dev overrides if needed
