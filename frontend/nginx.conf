server {
    listen 80;
    server_name _;

    # Serve SPA
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend service name "gp" (docker-compose)
    location /api/ {
        proxy_pass         http://gp:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Increase upstream timeouts to avoid 504 on long computations
        # 增大超时时间，适配冷启动下较长的推荐计算时长
        proxy_connect_timeout 30s;
        # 注意：在 Nginx 中将 proxy_read_timeout 设为 0 会立刻超时（504）。
        # 因此这里使用一个足够大的值，而非 0。
        proxy_send_timeout    12h;
        proxy_read_timeout    12h;
        send_timeout          12h;
    }

    # History fallback for SPA
    location / {
        try_files $uri /index.html;
    }

    # 不再提供 API fallback，保证只有单一主链。上游未就绪时由 Nginx 返回 502/504。
}
