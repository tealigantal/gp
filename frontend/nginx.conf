server {
    listen 80;
    server_name _;

    # Serve SPA
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend service name "gp" (docker-compose)
    location /api/ {
        proxy_pass         http://gp:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Increase upstream timeouts to avoid 504 on long computations
        # 增大超时时间，适配冷启动下较长的推荐计算时长
        proxy_connect_timeout 30s;
        # 注意：在 Nginx 中将 proxy_read_timeout 设为 0 会立刻超时（504）。
        # 因此这里使用一个足够大的值，而非 0。
        proxy_send_timeout    12h;
        proxy_read_timeout    12h;
        send_timeout          12h;
        # Friendly fallback during backend cold start instead of 502/504
        error_page 500 502 504 = @api_fallback;
    }

    # History fallback for SPA
    location / {
        try_files $uri /index.html;
    }

    # Fallback for API when upstream is not ready; returns a stable JSON payload
    location @api_fallback {
        default_type application/json;
        return 200 '{"picks": [], "meta": {"tradeable": false, "message": "backend starting", "debug": {"degraded": true, "degrade_reasons": [{"reason_code": "BACKEND_NOT_READY"}]}}}';
    }
}
