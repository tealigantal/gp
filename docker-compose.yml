services:
  gp:
    build:
      context: .
      args:
        BASE_PY_IMAGE: ${BASE_PY_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./universe:/app/universe
      - ./store:/app/store
      - ./cache:/app/cache
      - ./configs:/app/configs
    # Use multiple workers to avoid head-of-line blocking by long CPU-bound tasks
    # Respect proxy headers (X-Forwarded-*) when behind Nginx
    command: ["uvicorn", "gp_assistant.server.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # ---- run / dev mode ----
      GP_RUN_MODE: ${GP_RUN_MODE:-prod}
      GP_DEV_MODE: ${GP_DEV_MODE:-0}
      GP_RECOMMEND_MODE: ${GP_RECOMMEND_MODE:-}
      GP_DEV_SYMBOLS: ${GP_DEV_SYMBOLS:-}
      GP_DEV_OHLCV_LEN: ${GP_DEV_OHLCV_LEN:-90}

      # optional CORS (comma-separated)
      GP_CORS_ORIGINS: ${GP_CORS_ORIGINS:-}

      # ---- provider ----
      DATA_PROVIDER: ${DATA_PROVIDER:-akshare}
      # 0 表示不设超时（后端内部将按无限超时处理）
      GP_REQUEST_TIMEOUT_SEC: ${GP_REQUEST_TIMEOUT_SEC:-0}
      STRICT_REAL_DATA: ${STRICT_REAL_DATA:-1}

      # optional akshare route priority
      AK_SPOT_PRIORITY: ${AK_SPOT_PRIORITY:-}
      AK_DAILY_PRIORITY: ${AK_DAILY_PRIORITY:-}

      # ---- mainline / universe knobs ----
      GP_RESTRICT_MAINLINE: ${GP_RESTRICT_MAINLINE:-1}
      GP_MAINLINE_TOP_N: ${GP_MAINLINE_TOP_N:-2}
      GP_MAINLINE_MODE: ${GP_MAINLINE_MODE:-auto}

      GP_MIN_AVG_AMOUNT: ${GP_MIN_AVG_AMOUNT:-500000000}
      GP_NEW_STOCK_DAYS: ${GP_NEW_STOCK_DAYS:-60}
      GP_PRICE_MIN: ${GP_PRICE_MIN:-2}
      GP_PRICE_MAX: ${GP_PRICE_MAX:-500}
      GP_DYNAMIC_POOL_SIZE: ${GP_DYNAMIC_POOL_SIZE:-200}
      GP_MAX_PER_INDUSTRY: ${GP_MAX_PER_INDUSTRY:-2}
      # Tradeability thresholds (defaults restored)
      GP_TRADEABLE_MIN_UNIVERSE: ${GP_TRADEABLE_MIN_UNIVERSE:-50}
      GP_TRADEABLE_MIN_CANDIDATES: ${GP_TRADEABLE_MIN_CANDIDATES:-20}

      # ---- LLM (strict tools via beta) ----
      # Default to DeepSeek beta endpoint (strict tools). Override in .env if needed.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/beta}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-chat}

    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2).status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
  web:
    build:
      context: ./frontend
      args:
        BASE_NODE_IMAGE: ${BASE_NODE_IMAGE:-node:18-alpine}
        BASE_NGINX_IMAGE: ${BASE_NGINX_IMAGE:-nginx:1.25-alpine}
    depends_on:
      - gp
    ports:
      - "8080:80"
    volumes:
      # Mount nginx.conf so timeout tweaks apply without rebuild
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  gp_store: {}
  gp_cache: {}
