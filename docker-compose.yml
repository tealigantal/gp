x-gp-build: &gp-build
  context: .
  args:
    BASE_PY_IMAGE: ${BASE_PY_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    ALL_PROXY: ${ALL_PROXY:-}

x-gp-env: &gp-env
  TZ: ${TZ:-Asia/Shanghai}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}

  GP_RUN_MODE: ${GP_RUN_MODE:-prod}
  GP_DEV_MODE: ${GP_DEV_MODE:-0}
  GP_RECOMMEND_MODE: ${GP_RECOMMEND_MODE:-}
  GP_INTRADAY_RUNTIME_ENABLED: ${GP_INTRADAY_RUNTIME_ENABLED:-1}
  GP_DEV_SYMBOLS: ${GP_DEV_SYMBOLS:-}
  GP_DEV_OHLCV_LEN: ${GP_DEV_OHLCV_LEN:-90}
  GP_CORS_ORIGINS: ${GP_CORS_ORIGINS:-}
  DATA_PROVIDER: ${DATA_PROVIDER:-akshare}
  GP_REQUEST_TIMEOUT_SEC: ${GP_REQUEST_TIMEOUT_SEC:-30}
  GP_INTRADAY_FETCH_WORKERS: ${GP_INTRADAY_FETCH_WORKERS:-3}
  GP_INTRADAY_FETCH_TIMEOUT_SEC: ${GP_INTRADAY_FETCH_TIMEOUT_SEC:-180}
  GP_INTRADAY_FETCH_RETRY_MISSING: ${GP_INTRADAY_FETCH_RETRY_MISSING:-1}
  STRICT_REAL_DATA: ${STRICT_REAL_DATA:-1}
  GP_FORCE_REFRESH_LOOKBACK_DAYS: ${GP_FORCE_REFRESH_LOOKBACK_DAYS:-3}
  GP_ENFORCE_FORCE_REFRESH_ON_MISSING: ${GP_ENFORCE_FORCE_REFRESH_ON_MISSING:-1}
  AK_SPOT_PRIORITY: ${AK_SPOT_PRIORITY:-}
  AK_DAILY_PRIORITY: ${AK_DAILY_PRIORITY:-}
  GP_RESTRICT_MAINLINE: ${GP_RESTRICT_MAINLINE:-1}
  GP_MAINLINE_TOP_N: ${GP_MAINLINE_TOP_N:-2}
  GP_MAINLINE_MODE: ${GP_MAINLINE_MODE:-auto}
  GP_MIN_AVG_AMOUNT: ${GP_MIN_AVG_AMOUNT:-500000000}
  GP_NEW_STOCK_DAYS: ${GP_NEW_STOCK_DAYS:-60}
  GP_PRICE_MIN: ${GP_PRICE_MIN:-2}
  GP_PRICE_MAX: ${GP_PRICE_MAX:-500}
  GP_DYNAMIC_POOL_SIZE: ${GP_DYNAMIC_POOL_SIZE:-200}
  GP_MAX_PER_INDUSTRY: ${GP_MAX_PER_INDUSTRY:-2}
  GP_TRADEABLE_MIN_UNIVERSE: ${GP_TRADEABLE_MIN_UNIVERSE:-50}
  GP_TRADEABLE_MIN_CANDIDATES: ${GP_TRADEABLE_MIN_CANDIDATES:-20}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-deepseek-chat}
  AGENT_MODEL: ${AGENT_MODEL:-${CHAT_MODEL:-deepseek-chat}}

x-gp-volumes: &gp-volumes
  - ./data:/app/data
  - ./results:/app/results
  - ./universe:/app/universe
  - ./store:/app/store
  - ./cache:/app/cache
  - ./configs:/app/configs

x-gp-service: &gp-service
  build: *gp-build
  volumes: *gp-volumes
  env_file:
    - .env
  environment: *gp-env

services:
  gp:
    <<: *gp-service
    command: ["uvicorn", "gp_assistant.gateway.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  gp-worker:
    <<: *gp-service
    command: ["python", "-m", "gp_assistant.cli", "runtime-loop"]
    restart: unless-stopped

  gp-rebuild-daybook:
    <<: *gp-service
    command: ["python", "-m", "gp_assistant.cli", "rebuild-daybook"]
    profiles: ["ops"]
    restart: "no"

  gp-postclose-archive:
    <<: *gp-service
    command: ["python", "-m", "gp_assistant.cli", "postclose-archive"]
    profiles: ["ops"]
    restart: "no"

  web:
    build:
      context: ./frontend
      args:
        BASE_NODE_IMAGE: ${BASE_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        BASE_NGINX_IMAGE: ${BASE_NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.25-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
    depends_on:
      - gp
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
