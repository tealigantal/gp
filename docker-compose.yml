name: gp

x-backend-build: &backend-build
  context: .
  args:
    BASE_PY_IMAGE: ${BASE_PY_IMAGE:-python:3.11-slim-bookworm}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    ALL_PROXY: ${ALL_PROXY:-}
    GP_BUILD_REVISION: ${GP_BUILD_REVISION:-local}

x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Shanghai}
  GP_STORE_DIR: /app/store
  GP_DATA_DIR: /app/data
  GP_UNIVERSE_DIR: /app/universe
  GP_CONFIGS_DIR: /app/configs
  GP_HISTORY_SQLITE_JOURNAL_MODE: DELETE
  GP_AGENT_DB: /app/store/agent.db
  DATA_PROVIDER: ${DATA_PROVIDER:-akshare}
  STRICT_REAL_DATA: ${STRICT_REAL_DATA:-1}
  GP_INTRADAY_RUNTIME_ENABLED: ${GP_INTRADAY_RUNTIME_ENABLED:-1}

x-backend: &backend
  image: ${GP_BACKEND_IMAGE:-gp-backend}:${GP_BACKEND_TAG:-local}
  pull_policy: never
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - ./store:/app/store
    - ./data:/app/data
    - ./universe:/app/universe:ro
    - ./configs:/app/configs:ro
  init: true

services:
  api:
    <<: *backend
    build: *backend-build
    command: ["python", "-m", "gp_assistant.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "gp_assistant.cli", "runtime-loop"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  serenity:
    <<: *backend
    environment:
      <<: *backend-env
      GP_SERENITY_MODE: ${GP_SERENITY_MODE:-native}
    command: ["python", "-m", "gp_assistant.cli", "serenity-loop"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        BASE_NODE_IMAGE: ${BASE_NODE_IMAGE:-node:20-alpine}
        BASE_NGINX_IMAGE: ${BASE_NGINX_IMAGE:-nginx:1.25-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    init: true
    restart: unless-stopped
